name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: lib/client.js matches src/
        run: npm run build && git diff --exit-code lib/client.js
      - run: npm test
      - run: npm run test:e2e
      - name: Package contents
        run: npm pack --dry-run

  dsh:
    name: Real DSH (web)
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: 0.2.1-rc.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install DSH and pnpm
        run: npm install -g pnpm@10 "@deepseek-ai/dsh@$DSH_VERSION"
      - run: npm run test:dsh

# Publish a release on GitHub (Releases → Draft a new release → tag vX.Y.Z →
# Publish) and this builds the tarball and attaches it to that release. If the
# repository has an NPM_TOKEN secret, the same version is also published to npm.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm pack
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dsh-gov-boot-*.tgz --clobber
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

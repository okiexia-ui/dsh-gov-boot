# Push a tag like v0.4.1 and this builds the tarball, attaches it to a GitHub
# Release, and — if the repository has an NPM_TOKEN secret — publishes to npm.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm pack
      - name: Release notes from CHANGELOG.md
        run: |
          node -e "
            const fs = require('fs')
            const v = require('./package.json').version
            const part = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).find((s) => s.startsWith(v + '\n'))
            fs.writeFileSync('notes.md', part ? part.slice(v.length).trim() : 'See CHANGELOG.md')
          "
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dsh-gov-boot-*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
